<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div
          class="card-header bg-dark text-white p-4 d-flex justify-content-between align-items-center"
        >
          <h2 class="h4 mb-0 fw-bold">Crear Nuevo Ticket</h2>
          <button
            class="btn btn-outline-light rounded-pill px-4 btn-sm"
            [routerLink]="['/tickets']"
          >
            <i class="bi bi-arrow-left me-2"></i>Regresar
          </button>
        </div>

        <div class="card-body p-4">
          <form [formGroup]="ticketForm" (ngSubmit)="enviarTicket()">
            <div class="mb-3">
              <label class="form-label fw-bold text-secondary small text-uppercase">Título</label>
              <input
                type="text"
                formControlName="titulo"
                class="form-control form-control-lg shadow-sm"
              />
              <div
                class="text-danger small mt-1"
                [style.display]="
                  ticketForm.get('titulo')?.touched && ticketForm.get('titulo')?.invalid
                    ? 'block'
                    : 'none'
                "
              >
                El título debe tener al menos 5 caracteres.
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold text-secondary small text-uppercase"
                >Prioridad</label
              >
              <select formControlName="idPrioridad" class="form-select shadow-sm">
                <option [ngValue]="null" disabled selected></option>
                @for (p of prioridades(); track p.idPrioridad) {
                  <option [value]="p.idPrioridad">{{ p.nombre }}</option>
                }
              </select>
              <div
                class="text-danger small mt-1"
                [style.display]="
                  ticketForm.get('idPrioridad')?.touched && ticketForm.get('idPrioridad')?.invalid
                    ? 'block'
                    : 'none'
                "
              >
                Debes seleccionar una prioridad.
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-secondary small text-uppercase"
                >Descripción Detallada</label
              >
              <textarea
                maxlength="600"
                formControlName="descripcion"
                class="form-control shadow-sm"
                rows="5"
              ></textarea>
              <div
                class="text-danger small mt-1"
                [style.display]="
                  ticketForm.get('descripcion')?.touched && ticketForm.get('descripcion')?.invalid
                    ? 'block'
                    : 'none'
                "
              >
                La descripción es obligatoria.
              </div>
            </div>

            <div class="d-flex gap-2 justify-content-end border-top pt-4">
              <button
                type="button"
                class="btn btn-light rounded-pill px-4 fw-semibold text-muted"
                (click)="ticketForm.reset()"
              >
                Limpiar
              </button>

              <button
                type="submit"
                class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm"
                [disabled]="ticketForm.invalid"
              >
                <i class="bi bi-check-circle me-2"></i>Guardar Ticket
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
